name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: '手动指定版本号（留空则从 app.py 读取）'
        required: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VER="${{ github.event.inputs.version_override }}"
          else
            VER=$(python -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('app.py').read()).group(1))")
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      # ============================================================
      # 🔧 临时 patch：仅修改 CI 工作副本，不提交回仓库
      # ============================================================
      - name: Patch app.py for macOS compatibility
        run: |
          python -c "
import sys

with open('app.py', 'r', encoding='utf-8') as f:
    content = f.read()

# -------------------------------------------------------
# Patch 1: 顶层 import winreg → try/except
# -------------------------------------------------------
old = 'import winreg\nimport subprocess'
new = 'import subprocess\ntry:\n    import winreg\nexcept ImportError:\n    winreg = None  # macOS CI'
if old in content:
    content = content.replace(old, new)
    print('[PATCH 1] import winreg → try/except')
else:
    print('[PATCH 1] SKIP (already patched or not found)')

# -------------------------------------------------------
# Patch 2: if __name__ 块中的 import msvcrt → try/except + fcntl
# -------------------------------------------------------
old = '    import msvcrt\n'
new = '    try:\n        import msvcrt\n    except ImportError:\n        import fcntl\n        msvcrt = None\n'
if old in content:
    content = content.replace(old, new)
    print('[PATCH 2] import msvcrt → try/except + fcntl')
else:
    print('[PATCH 2] SKIP')

# -------------------------------------------------------
# Patch 3: 文件锁 → 跨平台（msvcrt / fcntl）
# -------------------------------------------------------
old_lock = '''    LOCK_FILE = str(DATA_DIR / \".gateway.lock\")
    try:
        _lock_fd = open(LOCK_FILE, \"w\")
        msvcrt.locking(_lock_fd.fileno(), msvcrt.LK_NBLCK, 1)
    except (OSError, IOError):
        import ctypes
        ctypes.windll.user32.MessageBoxW(
            0, \"网关客户端已在运行中，请勿重复启动。\", \"提示\", 0x30
        )
        sys.exit(0)'''

new_lock = '''    LOCK_FILE = str(DATA_DIR / \".gateway.lock\")
    try:
        _lock_fd = open(LOCK_FILE, \"w\")
        if msvcrt is not None:
            msvcrt.locking(_lock_fd.fileno(), msvcrt.LK_NBLCK, 1)
        else:
            fcntl.flock(_lock_fd.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
    except (OSError, IOError, AttributeError):
        if msvcrt is not None:
            import ctypes
            ctypes.windll.user32.MessageBoxW(
                0, \"网关客户端已在运行中，请勿重复启动。\", \"提示\", 0x30
            )
        else:
            print(\"网关客户端已在运行中，请勿重复启动。\", file=sys.stderr)
        sys.exit(0)'''

if old_lock in content:
    content = content.replace(old_lock, new_lock)
    print('[PATCH 3] 文件锁 → 跨平台 (msvcrt/fcntl)')
else:
    print('[PATCH 3] SKIP (pattern not found, trying alt...)')
    # Fallback: try with different indentation
    for indent in ['    ', '        ', '\t']:
        test_old = old_lock.replace('    LOCK_FILE', f'{indent}LOCK_FILE').replace('    try:', f'{indent}try:')
        if test_old in content:
            test_new = new_lock.replace('    LOCK_FILE', f'{indent}LOCK_FILE').replace('    try:', f'{indent}try:')
            content = content.replace(test_old, test_new)
            print(f'[PATCH 3] OK (indent: {repr(indent)})')
            break

with open('app.py', 'w', encoding='utf-8') as f:
    f.write(content)

print('✅ macOS patches applied')
"

      - name: Verify patches
        run: |
          echo "=== Checking for remaining Windows-only imports ==="
          grep -n "import winreg" app.py || echo "  ✓ import winreg now conditional"
          grep -n "import msvcrt" app.py || echo "  ✓ import msvcrt now conditional"
          grep -n "ctypes.windll" app.py || echo "  ✓ ctypes.windll now conditional"

      # ============================================================
      # 📦 PyInstaller 打包
      # ============================================================
      - name: Build with PyInstaller
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building v${VERSION}-网关客户端-macOS"
          pyinstaller \
            --onefile \
            --windowed \
            --name "v${VERSION}-网关客户端-macOS" \
            --add-data "templates:templates" \
            --add-data "models_meta.json:." \
            --hidden-import pystray._darwin \
            --hidden-import PIL \
            --exclude-module MicrosoftEdgeWebview2Setup \
            app.py

      - name: List build output
        run: |
          echo "=== dist/ ==="
          ls -lh dist/
          echo "=== build/ ==="
          ls -lh build/ 2>/dev/null || echo "(no build dir)"

      # ============================================================
      # 📤 上传产物
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-macos-v${{ steps.version.outputs.version }}
          path: dist/v*-网关客户端-macOS
          if-no-files-found: error

      # ============================================================
      # 🚀 可选：创建 DMG 并发布到 Release
      # ============================================================
      - name: Create DMG (optional)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="dist/v${VERSION}-网关客户端-macOS"
          DMG_NAME="v${VERSION}-网关客户端-macOS.dmg"
          if [ -f "$APP" ]; then
            mkdir -p dmg_staging
            cp "$APP" dmg_staging/
            hdiutil create -volname "模型网关" -srcfolder dmg_staging -ov -format UDZO "$DMG_NAME"
            ls -lh "$DMG_NAME"
            echo "DMG created: $DMG_NAME"
          fi

      - name: Upload DMG to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          fail_on_unmatched: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
