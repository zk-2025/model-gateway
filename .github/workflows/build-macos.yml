name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: '手动指定版本号（留空则从 app.py 读取）'
        required: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VER="${{ github.event.inputs.version_override }}"
          else
            VER=$(python -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('app.py').read()).group(1))")
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Patch app.py for macOS
        run: python scripts/patch_for_macos.py

      - name: Verify patches
        run: |
          echo "=== 检查 patch 是否生效 ==="
          if grep -n "^import winreg" app.py; then
            echo "ERROR: import winreg 顶层仍未 patch！"; exit 1
          fi
          if grep -n "^    import msvcrt" app.py; then
            echo "ERROR: import msvcrt 仍未 patch！"; exit 1
          fi
          echo "Patches OK"

      - name: Build with PyInstaller
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building v${VERSION}-网关客户端-macOS"
          pyinstaller \
            --onefile \
            --windowed \
            --name "v${VERSION}-网关客户端-macOS" \
            --add-data "templates:templates" \
            --add-data "models_meta.json:." \
            --hidden-import pystray._darwin \
            --hidden-import PIL \
            --exclude-module winreg \
            app.py

      - name: List build output
        run: |
          echo "=== dist/ ==="
          ls -lh dist/ 2>/dev/null || (echo "ERROR: no dist/"; exit 1)
          file dist/*macOS* 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-macos-v${{ steps.version.outputs.version }}
          path: dist/v*-网关客户端-macOS
          if-no-files-found: error

      - name: Create DMG (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="dist/v${VERSION}-网关客户端-macOS"
          DMG_NAME="v${VERSION}-网关客户端-macOS.dmg"
          if [ -f "$APP" ]; then
            mkdir -p dmg_staging
            cp "$APP" dmg_staging/
            hdiutil create -volname "ModelGateway" -srcfolder dmg_staging -ov -format UDZO "$DMG_NAME"
            ls -lh "$DMG_NAME"
          else
            echo "App binary not found, skip DMG"
          fi

      - name: Upload DMG to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          fail_on_unmatched: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}